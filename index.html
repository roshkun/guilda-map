<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Mapa</title>
  <!-- Leaflet via CDN. Para uso 100% offline, baixe leaflet.css/leaflet.js e aponte para js/vendor/ -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button id="sidebar-toggle" aria-label="Abrir/fechar painel">☰</button>

  <aside id="sidebar">
    <header>
      <h1 id="title">Meu Mapa</h1>
      <p id="subtitle"></p>
    </header>

    <div class="search">
      <input id="search" type="search" placeholder="Buscar lugar, país, documento…" autocomplete="off">
      <ul id="results" hidden></ul>
    </div>

    <section id="route-panel">
      <div class="section-head">
        <h2>Rotas e viagens</h2>
        <button id="route-clear" class="link" hidden>limpar</button>
      </div>
      <div class="rt-field" id="rt-from-wrap">
        <input id="rt-from" type="search" placeholder="Origem" autocomplete="off">
        <ul id="rt-from-list" class="rt-list" hidden></ul>
      </div>
      <button id="rt-swap" class="link rt-swap" title="Inverter">⇅ inverter</button>
      <div class="rt-field" id="rt-to-wrap">
        <input id="rt-to" type="search" placeholder="Destino" autocomplete="off">
        <ul id="rt-to-list" class="rt-list" hidden></ul>
      </div>
      <div id="rt-modes" class="rt-opts"></div>
      <div class="rt-opts">
        <label id="rt-train-label"><input type="checkbox" id="rt-train"> 🚂 Ferroáurea</label>
        <label id="rt-air-label"><input type="checkbox" id="rt-air"> 🎈 Aeronau</label>
        <label id="rt-boat-label"><input type="checkbox" id="rt-boat"> ⛵ Barco pequeno</label>
        <label id="rt-ship-label"><input type="checkbox" id="rt-ship"> 🚢 Navio grande</label>
      </div>
      <div id="rt-out"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>Camadas</h2>
        <span>
          <button id="all-on" class="link">todas</button> ·
          <button id="all-off" class="link">nenhuma</button>
        </span>
      </div>
      <ul id="filters"></ul>
    </section>

    <footer>
      <button id="share">🔗 Copiar link desta vista</button>
      <small>Clique com o botão direito (ou segure) num pin para ocultá-lo. Adicione <code>?edit</code> à URL para pegar coordenadas.</small>
    </footer>
  </aside>

  <div id="map"></div>
  <div id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/travel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
